allowBuilds:
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: false
overrides:
  # Patched releases inside the ranges their parents ask for, which pnpm update leaves transitive deps short of.
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'vite@>=8.0.0 <8.3.3': '^8.3.3'
  # A major past what typescript-eslint and @sentry/bundler-plugins ask for, as no patched release is in their range; both keep the API they call.
  'glob@>=9.0.0 <14.0.2': '^14.0.2'
  'minimatch@>=10.0.0 <11.0.1': '^11.0.1'
